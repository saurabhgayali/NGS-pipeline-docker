version: '3.9'

services:
  ngs-pipeline-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ngs-pipeline-web
    
    # Environment variables
    environment:
      PORT: 7860
      PYTHONUNBUFFERED: 1
    
    # Port mapping
    ports:
      - "7860:7860"
    
    # Volume mounts for data persistence
    volumes:
      # Input queue directory - mount host directory to container
      - ./data/input_queue:/app/data/input_queue
      
      # Projects directory - mount host directory to container
      - ./data/projects:/app/data/projects
      
      # Scripts directory - mount NGS pipeline scripts
      - ./scripts:/app/scripts:ro
      
      # Data directory for references and raw reads (read-only recommended)
      - ./data/reference:/app/data/reference:ro
      - ./data/raw_reads:/app/data/raw_reads
      
      # Metadata directory
      - ./metadata:/app/metadata:ro
    
    # Restart policy
    restart: unless-stopped
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # Resource limits (optional - adjust based on your hardware)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '4'
    #       memory: 8G
    #     reservations:
    #       cpus: '2'
    #       memory: 4G

  # Optional: Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: ngs-pipeline-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./data/projects:/usr/share/nginx/html/projects:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - ngs-pipeline-web
    restart: unless-stopped
    profiles:
      - prod

networks:
  default:
    name: ngs-pipeline-network
